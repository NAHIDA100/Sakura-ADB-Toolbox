<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fbf8ff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Sakura ADB Toolbox</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/motion.css">
</head>
<body>
  <div class="app-ambient" aria-hidden="true">
    <div class="ambient__wash"></div>
    <span class="blob blob--pink"></span>
    <span class="blob blob--violet"></span>
    <span class="blob blob--blue"></span>
    <span class="blob blob--mint"></span>
    <span class="bubble bubble--one"></span>
    <span class="bubble bubble--two"></span>
    <span class="bubble bubble--three"></span>
    <span class="ambient__grain"></span>
  </div>

  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot__aura"></div>
    <div class="boot__mark">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="bootGrad" x1="6" y1="4" x2="42" y2="45" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ff7eac"/><stop offset=".55" stop-color="#ff4f8f"/><stop offset="1" stop-color="#b47bf3"/>
          </linearGradient>
        </defs>
        <rect width="48" height="48" rx="15" fill="url(#bootGrad)"/>
        <path d="M17.8 16.4 15 12.9M30.2 16.4 33 12.9" stroke="#fff" stroke-width="1.7" stroke-linecap="round" opacity=".9"/>
        <path d="M24 17.2c-6.35 0-11.5 5.15-11.5 11.5v4.9c0 2.4 1.95 4.35 4.35 4.35h14.3c2.4 0 4.35-1.95 4.35-4.35v-4.9c0-6.35-5.15-11.5-11.5-11.5Z" fill="#fff" opacity=".96"/>
        <circle cx="20.1" cy="27.4" r="1.45" fill="#f04886"/>
        <circle cx="27.9" cy="27.4" r="1.45" fill="#f04886"/>
        <path d="M37.8 12.4c1.7-2.4 4.4-2.2 5.2-.6.8 1.7-1.4 4.6-4.9 4.1-.7-.1-.9-.2-1.3-.5.3-.9.6-1.9 1-3Z" fill="#fff" opacity=".62"/>
        <path d="M9.2 29.9c-2.3 1.5-2.6 4-.9 5 1.6.9 4.2-.9 4-4.4 0-.6-.1-.8-.4-1.2-1 .1-2 .3-2.7.6Z" fill="#fff" opacity=".42"/>
      </svg>
    </div>
    <div class="boot__name">Sakura <span>ADB Toolbox</span></div>
    <div class="boot__line"><span></span></div>
    <div class="boot__hint">正在唤醒设备工作台…</div>
  </div>

  <div id="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-stack" aria-live="assertive"></div>

  <script src="js/bridge-loader.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
